name: Android APK Release & CI/CD

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Test Android APK
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew test --stacktrace

      - name: Build Debug & Release APK
        run: ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: crootagent-mobile-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: crootagent-mobile-release
          path: app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Determine Version Tag
        id: get_version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TIMESTAMP=$(date +'%Y%m%d%H%M')
            TAG="v1.0.${TIMESTAMP}"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Create Git Tag (for main push)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f ${{ steps.get_version.outputs.tag }}
          git push origin ${{ steps.get_version.outputs.tag }} || true

      - name: Publish GitHub Release with APK Assets
        if: startsWith(github.ref, 'refs/tags/') || (github.ref == 'refs/heads/main' && github.event_name == 'push')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.tag }}
          name: "CRootAgent Mobile Release ${{ steps.get_version.outputs.tag }}"
          draft: false
          prerelease: false
          files: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release-unsigned.apk
          body: |
            ## CRootAgent Mobile Android Release 🦀📱
            
            Automated CI/CD build for CRootAgent Mobile application.
            
            ### Included Assets
            - `app-debug.apk`: Ready-to-install development build with debug logging.
            - `app-release-unsigned.apk`: Production build asset.
            
            ### Features
            - Native Android Material Design UI with dark developer aesthetic.
            - Remote Agent Chat Console with auto-scroll and model metadata badges.
            - One-tap quick commands (`git status`, `cargo test`, `crootagent models`, `session list`).
            - Multi-LLM provider client supporting Google Gemini, Groq, OpenAI, and Ollama.
            - Persistent settings for API credentials and active model selection.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
